<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <head th:replace="~{fragments/head :: head('Cadastro de Cliente')}"></head>
</head>

<main>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">
                            <i class="bi bi-person-plus"></i> Cadastro de Cliente
                        </h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- Mensagens de Erro -->
                        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                        <form th:action="@{/pessoa/save}" method="post">
                            <h5 class="mb-3 text-muted border-bottom pb-2">Informações Pessoais</h5>

                            <div class="mb-3">
                                <label for="identificador" class="form-label fw-bold">CPF ou CNPJ</label>
                                <input type="text" id="identificador" name="identificador" class="form-control"
                                       placeholder="Digite apenas números" required>
                                <small class="text-muted">O sistema identificará automaticamente se é Pessoa Física ou Jurídica.</small>
                            </div>

                            <div class="mb-3">
                                <label for="nomeRazao" class="form-label fw-bold">Nome Completo ou Razão Social</label>
                                <input type="text" id="nomeRazao" name="nomeRazao" class="form-control" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-bold">E-mail</label>
                                    <input type="email" id="email" name="email" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="telefone" class="form-label fw-bold">Telefone</label>
                                    <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                                </div>
                            </div>

                            <h5 class="mb-3 mt-4 text-muted border-bottom pb-2">Dados de Acesso</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="login" class="form-label fw-bold">Usuário (Login)</label>
                                    <input type="text" id="login" name="login" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label fw-bold">Senha</label>
                                    <input type="password" id="password" name="password" class="form-control" required>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg">Finalizar Cadastro</button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}" class="text-decoration-none">Já tenho uma conta. Fazer Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
